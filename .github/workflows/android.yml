# Gera o app Android (APK para instalar direto + AAB para a Play Store) a partir do PWA.
# Rode manualmente em: GitHub > Actions > "App Android (APK/AAB)" > Run workflow.
# Segredos necessários (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   conteúdo do android.keystore em base64 (base64 -w0 android.keystore)
#   ANDROID_KEYSTORE_PASSWORD senha do keystore
#   ANDROID_KEY_PASSWORD      senha da chave
#   ANDROID_KEY_ALIAS         alias da chave (ex.: ducks)
name: App Android (APK/AAB)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domínio do site (sem https://), ex.: ducksoffroad.com.br"
        required: true
      version_name:
        description: "Versão (ex.: 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Número da versão (inteiro, sempre maior que o anterior)"
        required: true
        default: "1"
      package:
        description: "ID do pacote Android"
        required: true
        default: "br.com.ducksoffroad.app"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validar entradas
        env:
          DOMAIN: ${{ inputs.domain }}
          VCODE: ${{ inputs.version_code }}
          PKG: ${{ inputs.package }}
          VNAME: ${{ inputs.version_name }}
        run: |
          [[ "$DOMAIN" =~ ^[a-z0-9.-]+\.[a-z]{2,}$ ]] || { echo "Domínio inválido"; exit 1; }
          [[ "$VCODE" =~ ^[0-9]+$ ]] || { echo "version_code deve ser inteiro"; exit 1; }
          [[ "$PKG" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]] || { echo "Pacote inválido"; exit 1; }
          [[ "$VNAME" =~ ^[0-9A-Za-z.\-]+$ ]] || { echo "Versão inválida"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Preparar projeto TWA
        env:
          DOMAIN: ${{ inputs.domain }}
          VNAME: ${{ inputs.version_name }}
          VCODE: ${{ inputs.version_code }}
          PKG: ${{ inputs.package }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/build && cd android/build
          sed -e "s/__DOMAIN__/${DOMAIN}/g" -e "s/__PACKAGE__/${PKG}/g" -e "s/__KEY_ALIAS__/${ALIAS}/g" \
              -e "s/__VERSION_NAME__/${VNAME}/g" -e "s/__VERSION_CODE__/${VCODE}/g" \
              ../twa-manifest.template.json > twa-manifest.json
          echo "$KEYSTORE_B64" | base64 -d > android.keystore
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"${ANDROID_HOME}\"}" > ~/.bubblewrap/config.json
          npm install -g @bubblewrap/cli@1
          yes | bubblewrap update --skipVersionUpgrade

      - name: Gerar APK e AAB assinados
        working-directory: android/build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          yes | bubblewrap build --skipPwaValidation
          keytool -list -v -keystore android.keystore -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep -E "SHA256:" | awk '{print "Impressão SHA-256 (ANDROID_SHA256_FINGERPRINTS): "$2}'
          rm -f android.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: ducks-offroad-android-${{ inputs.version_name }}
          path: |
            android/build/app-release-signed.apk
            android/build/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 30
