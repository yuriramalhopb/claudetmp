# Roda os testes automáticos a cada push e pull request.
name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, gd, sodium, curl, mbstring, xml, xmlreader, xmlwriter, fileinfo, iconv, posix
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar sintaxe PHP
        run: find app bin public tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Verificar sintaxe JavaScript
        run: |
          for f in public/sw.js public/assets/js/*.js; do node --check "$f"; done

      - name: Testes (unitários + ponta a ponta com MySQL)
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_PASS: root
          TEST_DB_NAME: ducks_test
        run: php tests/run.php
