# Exemplo de configuração Nginx + PHP-FPM para o Ducks Offroad
server {
    listen 80;
    server_name ducksoffroad.com.br www.ducksoffroad.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ducksoffroad.com.br www.ducksoffroad.com.br;

    ssl_certificate     /etc/letsencrypt/live/ducksoffroad.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ducksoffroad.com.br/privkey.pem;

    root /var/www/ducks-offroad/public;
    index index.php;
    client_max_body_size 64M;
    server_tokens off;

    # arquivos ocultos (exceto /.well-known: certificado SSL e app Android)
    location ~ /\.(?!well-known/) { deny all; }
    location = /.well-known/assetlinks.json { try_files $uri /index.php$is_args$args; }

    # uploads: só arquivos estáticos, nunca executa PHP
    location ^~ /uploads/ {
        location ~* \.(php\d?|phtml|phar|html?|svg|js)$ { deny all; }
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox";
        expires 30d;
        try_files $uri =404;
    }

    # PWA: service worker e manifesto sempre revalidados
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /offline.html { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ { return 404; }
}
