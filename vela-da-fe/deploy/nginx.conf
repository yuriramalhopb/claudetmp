# Exemplo de configuração Nginx + PHP-FPM para o Vela da Fé
server {
    listen 80;
    server_name velas.suaigreja.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name velas.suaigreja.com.br;

    ssl_certificate     /etc/letsencrypt/live/velas.suaigreja.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/velas.suaigreja.com.br/privkey.pem;

    root /var/www/vela-da-fe/public;
    index index.php;
    server_tokens off;

    # arquivos ocultos (exceto /.well-known: certificado SSL)
    location ~ /\.(?!well-known/) { deny all; }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # nenhum outro .php é executado
    location ~ \.php$ { return 404; }
}
